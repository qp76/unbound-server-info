name: Build and publish Server Info

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate addon
        run: bunx @unbound-app/cli check --json

      - name: Build addon
        run: bunx @unbound-app/cli build --json

      - name: Prepare installable manifest folder
        run: |
          mkdir -p site
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const id = 'qp76.server-info';
          const ignored = new Set(['.git', 'node_modules', '.bun', '.github']);
          const found = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ent.isDirectory()) {
                if (!ignored.has(ent.name)) walk(path.join(dir, ent.name));
              } else if (ent.name === 'manifest.json') {
                const file = path.join(dir, ent.name);
                try {
                  const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
                  if (manifest.id === id && fs.existsSync(path.join(dir, 'index.js'))) {
                    found.push({ dir, manifest });
                  }
                } catch {}
              }
            }
          }
          walk('.');
          if (!found.length) {
            console.error('Build output with manifest.json and index.js was not found.');
            process.exit(1);
          }
          const output = found[found.length - 1];
          fs.cpSync(output.dir, 'site', { recursive: true });
          console.log('Prepared install folder from ' + output.dir);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
