name: Build and publish Server Info

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-info-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate addon
        run: bunx @unbound-app/cli check --json

      - name: Build addon
        run: bunx @unbound-app/cli build --json

      - name: Prepare installable plugin folder
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const id = 'qp76.server-info';
          const ignored = new Set(['.git', 'node_modules', '.bun', '.github', 'site']);
          const found = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ent.isDirectory()) {
                if (!ignored.has(ent.name)) walk(path.join(dir, ent.name));
              } else if (ent.name === 'manifest.json') {
                const folder = path.dirname(path.join(dir, ent.name));
                try {
                  const manifest = JSON.parse(fs.readFileSync(path.join(folder, ent.name), 'utf8'));
                  if (manifest.id === id && fs.existsSync(path.join(folder, 'index.js'))) {
                    found.push(folder);
                  }
                } catch {}
              }
            }
          }
          walk('.');
          if (!found.length) {
            console.error('Could not find the built plugin folder containing manifest.json and index.js.');
            process.exit(1);
          }
          const output = found.find(p => p === 'dist') || found[0];
          fs.rmSync('site', { recursive: true, force: true });
          fs.mkdirSync('site', { recursive: true });
          fs.cpSync(output, 'site', { recursive: true });
          console.log('Prepared plugin files from ' + output);
          NODE

      - name: Publish plugin files to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
